[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppqm"
dynamic = ["version"]
maintainers = [{name = "Jimmy Kromann"}, {name = "Hagen Muenkler"}]
description = "Utilities for running QM calculations with RDKit"
readme = "readme.rst"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "tqdm",
    "rmsd",
    "rdkit",
]

[project.optional-dependencies]
interactive = [
    "ipywidgets",
    "nglview",
    "ipython",
    "pandas",
    "matplotlib",
]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "black",
    "build",
    "flake8",
    "isort",
    "mypy",
    "pre-commit",
    "twine",
]

[tool.setuptools.dynamic]
version = {attr = "ppqm.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
