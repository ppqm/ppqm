[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppqm"
dynamic = ["version"]
maintainers = [{name = "Jimmy Kromann"}, {name = "Hagen Muenkler"}]
description = "Utilities for running QM calculations with RDKit"
readme = "readme.rst"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "tqdm",
    "rmsd",
    "rdkit",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "build",
    "ipython",
    "ipywidgets",
    "jupytext",
    "matplotlib",
    "nglview",
    "pandas",
    "pip",
    "pre-commit",
    "ruff",
    "twine",
    "ty",
]

[tool.setuptools.dynamic]
version = {attr = "ppqm.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 99
target-version = "py310"
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "env",
    "notebooks/",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]

[tool.ruff.lint.isort]
known-first-party = ["ppqm"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B023", "E501"]
"*/__init__.py" = ["F401"]
"ppqm/calculator.py" = ["B024"]
"ppqm/chembridge.py" = ["E501"]

[tool.ty]

[tool.ty.rules]
unresolved-import = "ignore"
